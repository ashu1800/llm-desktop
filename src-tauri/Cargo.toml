[package]
name = "llm-desktop"
version = "0.1.12"
description = "本地 LLM API 网关"
edition = "2021"

[lib]
name = "llm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# 倍率规则的日类型/时段判定(本地时区)
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
] }
tokio-stream = "0.1"
rand = "0.9"
regex = "1"
# 客户端图标支持任意图片格式:选取后统一解码→缩方到 64px→重编码 PNG dataURL
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
  "ico",
  "tiff",
  "tga",
  "dds",
  "ff",
  "hdr",
  "exr",
  "qoi",
] }
tiktoken-rs = "0.6"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
  "gzip",
  "brotli",
  "deflate",
  "socks",
  "http2",
] }
# tauri-plugin-updater 依赖 reqwest 0.13 但没开 socks,导致更新检查遇到
# socks5:// 代理时报 "unknown proxy scheme"。cargo feature 按 crate 版本隔离,
# 0.12 的 socks 不会传染给 0.13,故此处显式再声明 0.13 并开 socks——
# feature union 会作用到插件用的同一个 0.13 实例上。
# 纯 feature 声明,业务代码仍用上面的 reqwest 0.12,勿在本工程引用 reqwest13。
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = [
  "socks",
] }
tauri-plugin-opener = "2.7.2"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
# 发布构建提速:codegen-units=16 与 lto=false 相比默认(cgu=1+thin LTO)显著缩短
# CI 构建时间;二进制略大、运行时性能差异对网关负载不可感知。
# 需要极致性能的手工发布可临时改回 cgu=1 + lto="thin"
codegen-units = 16
strip = true
