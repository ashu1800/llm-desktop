# 自动发布:推送 vX.Y.Z 标签 → 构建 Windows 安装包 → minisign 签名 → 生成 latest.json → 创建 GitHub Release
# 客户端经 tauri-plugin-updater 检查 releases/latest/download/latest.json 自动更新。
#
# 前置(一次性):仓库 Settings → Secrets and variables → Actions 配置:
#   TAURI_SIGNING_PRIVATE_KEY            = 私钥内容(~/.tauri/llm-desktop.key,勿入库)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   = 私钥口令(无口令则设为空字符串)

name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write # 创建 Release 与上传产物
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 发布说明需要自上个标签以来的完整提交历史

      # 标签与 tauri.conf.json 版本不一致会发布出"永远不触发客户端更新"的版本
      - name: Verify tag matches app version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CFG=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "$CFG" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 tauri.conf.json 版本 ${CFG} 不一致;请同步版本号(tauri.conf.json / package.json / Cargo.toml)后重新打附注标签"
            exit 1
          fi

      # 从上个标签以来的提交生成分类更新说明(新功能/错误修复/改进),供更新弹窗按版本渲染
      - name: Generate release notes from commits
        id: notes
        shell: bash
        run: |
          set -e
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${PREV_TAG:+${PREV_TAG}..}HEAD"
          NOTES=$(mktemp)
          emit() {
            local header="$1" pattern="$2" items
            items=$(git log "${RANGE}" --pretty=format:%s | grep -iE "${pattern}" | sed -E 's/^[a-zA-Z]+(\([^)]*\))?[::][[:space:]]*/- /' || true)
            if [ -n "${items}" ]; then
              { echo "### ${header}"; echo "${items}"; echo ""; } >> "${NOTES}"
            fi
          }
          emit "新功能" "^feat"
          emit "错误修复" "^fix"
          emit "改进" "^(ui|refactor|perf|chore|docs|build|ci|style|test)"
          if [ ! -s "${NOTES}" ]; then
            echo "- 稳定性修复与体验优化" > "${NOTES}"
          fi
          {
            echo "body<<NOTES_EOF"
            cat "${NOTES}"
            echo "NOTES_EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # shared-key 固定:默认按 git ref 派生 key,发版走 tag ref 导致每次缓存
      # miss、356+ crates 全量重编(约 8 分钟)。固定后跨 tag 命中,只重编变更链
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          prefix-key: v1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LLM Gateway ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # 生成 latest.json 并上传到 Release(updater 端点指向 releases/latest/download/latest.json)
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
